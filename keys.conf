# Keys

# Main Dev Split
bind \\ split-window -h -c "#{pane_current_path}" -p 35 \; send-keys "\\" Enter C-l \; split-window -v \; send-keys "\\" Enter C-l \; select-pane -t 2
bind | kill-pane -a -t 1

# Override to split on current pane path
bind-key % split-window -h -c "#{pane_current_path}"

# Reload tmux conf
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# List session/pannels and folder and program
# NOTE: Disable for now. Can use the zsh function `tlist`. Simpler and work everywhere.
# bind m send-keys "tmux list-panes -a -F '#{?session_attached,ATTACHED,DETACHED} #S:#I.#P \"#{window_name}\" #{pane_current_path} #{pane_current_command}'" Enter

## Disabled for now, since tmux-plugins
bind-key -T copy-mode-vi o send-keys -X copy-pipe-and-cancel "xargs open"
bind-key -T copy-mode    o send-keys -X copy-pipe-and-cancel "xargs open"


# Clear right panels
bind K send-keys -t 2 "clear" Enter "\\" Enter C-l \; send-keys -t 3 "clear" Enter "\\" Enter C-l

# Pane nav
bind-key o select-pane -t :.+ # already default
bind-key O select-pane -t :.-

# Clear current pane
bind k send-keys "clear" Enter "\\" Enter C-l

# Kill pane (remove the 'confirm-before')
bind x kill-pane

# Kill session
bind x kill-session

# Set pane title (will show in tab name if dynamic naming is on)
bind T command-prompt -p "Pane Title:" "select-pane -T '%%'"

# Popup terminal
bind y display-popup -E -w 70% -h 70%

# Toggle persistent popup window (on top)
bind u if-shell -F '#{==:#{session_name},popup-win}' {
    detach-client
} {
    display-popup -w 80% -h 80% -E "tmux attach-session -t popup-win || tmux new-session -s popup-win"
}
