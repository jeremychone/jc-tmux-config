# Style & Format
set -g status-style "fg=#666666,bg=black"

# Status bar format
set -g status-interval 5
set -g window-status-format " #[fg=colour243,bg=black] #I:#W "
set -g window-status-current-format " #[fg=colour33,bg=black]#[fg=black,bg=colour33] #I:#W #[fg=colour33,bg=black]"
set -g status-right "#[fg=colour235,bg=black]#[fg=colour250,bg=colour234] #(echo '#{pane_current_path}' | rev | cut -d'/' -f1-2 | rev) "
